# DataCleaner FlatLaf custom defaults, applied to all themes (light and dark).
# See https://www.formdev.com/flatlaf/properties-files/ for the syntax.

# DataCleaner brand accent color: drives default button, focus rings,
# selections, tree/tab lines etc. across the UI.
@accentColor = #04a6d8

# Typography: "defaultFont" and "TitledBorder.font" are set programmatically
# in LookAndFeelManager.init() (Muli 13 / Muli Light 18) because FlatLaf's
# system font policy would rescale absolute font sizes specified here to the
# desktop font size. All component fonts below derive from "defaultFont".
TitledBorder.titleColor = #04a6d8
TableHeader.font = +bold

# Tooltips: dark DC-style tooltips, rendered with FlatLaf's rounded shape
ToolTip.background = #212121
ToolTip.foreground = #f5f5f5
ToolTip.border = 4,8,4,8

# Scrollbars and progress bar
ScrollBar.minimumThumbSize = 30,30
ProgressBar.foreground = #05cdff

# Task panes (SwingX JXTaskPane) with dark DC style titles
TaskPaneContainer.background = #f5f5f5
TaskPane.background = #ffffff
TaskPane.font = +bold
TaskPane.titleForeground = #ffffff
TaskPane.titleBackgroundGradientStart = #212121
TaskPane.titleBackgroundGradientEnd = #212121
TaskPane.borderColor = #373737

# Table header separators
[light]TableHeader.separatorColor = #dcdcdc
[dark]TableHeader.separatorColor = #3c3f42

# "Flattening" of scroll panes and split panes (remove bevel-like borders)
ScrollPane.border = 0,0,0,0
SplitPane.border = 0,0,0,0
SplitPaneDivider.border = 0,0,0,0
