# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Configure GitHub Packages authentication (metamodel)
      env:
        PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'SETTINGS'
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
          <servers>
            <server>
              <id>github-metamodel</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${PACKAGES_READ_TOKEN}</password>
            </server>
          </servers>
        </settings>
        SETTINGS
        # expand the environment variables in the settings file
        sed -i "s/\${GITHUB_ACTOR}/$GITHUB_ACTOR/" ~/.m2/settings.xml
        sed -i "s/\${PACKAGES_READ_TOKEN}/$PACKAGES_READ_TOKEN/" ~/.m2/settings.xml
    - name: Build with Maven
      run: mvn -B package --file pom.xml
